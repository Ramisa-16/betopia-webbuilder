name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Build / Linux
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci --legacy-peer-deps

      - name: Patch version from tag
        working-directory: desktop
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > _tmp.json
          mv _tmp.json src-tauri/tauri.conf.json
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Tauri (Linux)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          retention-days: 1
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    name: Build / Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci --legacy-peer-deps

      - name: Patch version from tag
        working-directory: desktop
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > _tmp.json
          mv _tmp.json src-tauri/tauri.conf.json
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build Tauri (Windows)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          retention-days: 1
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip
            desktop/src-tauri/target/release/bundle/msi/*.msi.zip.sig
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
            desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig

  # ── macOS ─────────────────────────────────────────────────────────────────
  build-macos:
    name: Build / macOS (universal)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci --legacy-peer-deps

      - name: Patch version from tag
        working-directory: desktop
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > _tmp.json
          mv _tmp.json src-tauri/tauri.conf.json
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Import Apple certificate (optional)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured — skipping codesign"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode -o cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"

      - name: Build Tauri (macOS universal)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          retention-days: 1
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # ── Publish ───────────────────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Extract version and date
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME"       >> "$GITHUB_OUTPUT"
          echo "pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          PUB_DATE: ${{ steps.meta.outputs.pub_date }}
        run: |
          BASE="https://github.com/betopia-ai/betopia-webbuilder-releases/releases/download/${TAG}"

          read_sig() {
            local f
            f=$(find artifacts -name "$1" 2>/dev/null | head -1)
            [ -n "$f" ] && cat "$f" || printf ""
          }
          artifact_name() {
            find artifacts -name "$1" -not -name "*.sig" 2>/dev/null | head -1 | xargs -r basename
          }

          LINUX_SIG=$(read_sig   "*.AppImage.tar.gz.sig")
          LINUX_FILE=$(artifact_name "*.AppImage.tar.gz")
          WIN_SIG=$(read_sig     "*.msi.zip.sig")
          WIN_FILE=$(artifact_name   "*.msi.zip")
          MAC_SIG=$(read_sig     "*.app.tar.gz.sig")
          MAC_FILE=$(artifact_name   "*.app.tar.gz")

          python3 - \
            "$VERSION" "$TAG" "$PUB_DATE" "$BASE" \
            "$LINUX_SIG" "$LINUX_FILE" \
            "$WIN_SIG"   "$WIN_FILE" \
            "$MAC_SIG"   "$MAC_FILE" \
            <<'PYEOF'
          import json, sys

          _, ver, tag, pub, base, \
            lsig, lfile, wsig, wfile, msig, mfile = sys.argv

          def entry(sig, fname):
              return {"signature": sig.strip(), "url": f"{base}/{fname}" if fname else ""}

          manifest = {
              "version":  ver,
              "notes":    f"Betopia Coder {tag}",
              "pub_date": pub,
              "platforms": {
                  "linux-x86_64":   entry(lsig, lfile),
                  "windows-x86_64": entry(wsig, wfile),
                  "darwin-x86_64":  entry(msig, mfile),
                  "darwin-aarch64": entry(msig, mfile),
              },
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Create release in betopia-webbuilder-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Collect installer + updater bundle files (exclude raw .sig — those live in latest.json)
          mapfile -t FILES < <(find artifacts -type f \( \
            -name "*.deb"                 \
            -o -name "*.AppImage"         \
            -o -name "*.rpm"              \
            -o -name "*.msi"              \
            -o -name "*.exe"              \
            -o -name "*.dmg"              \
            -o -name "*.AppImage.tar.gz"  \
            -o -name "*.AppImage.tar.gz.sig" \
            -o -name "*.msi.zip"          \
            -o -name "*.msi.zip.sig"      \
            -o -name "*.app.tar.gz"       \
            -o -name "*.app.tar.gz.sig"   \
          \))

          gh release create "${TAG}" \
            --repo betopia-ai/betopia-webbuilder-releases \
            --title "Betopia Coder ${TAG}" \
            --notes "## Betopia Coder ${VERSION}

          **Updater endpoint** (add to \`tauri.conf.json → plugins.updater.endpoints\`):
          \`https://github.com/betopia-ai/betopia-webbuilder-releases/releases/latest/download/latest.json\`

          | Platform | File |
          |----------|------|
          | Linux | \`.deb\` · \`.AppImage\` · \`.rpm\` |
          | Windows | \`.msi\` · \`.exe\` (NSIS) |
          | macOS universal | \`.dmg\` |" \
            "${FILES[@]}" \
            latest.json
